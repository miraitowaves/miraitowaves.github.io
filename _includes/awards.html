{% if site.data.awards %}
<section class="awards" aria-labelledby="awards-title">
  <div class="section-label" aria-hidden="true"><span>02</span><span>RECOGNITION</span></div>
  <h2 id="awards-title">Selected Awards</h2>

  <ul class="award-list">
    {% for award in site.data.awards.main %}
    <li>{% if award.link %}<a href="{{ award.link }}">{{ award.title | escape }}</a>{% else %}{{ award.title | escape }}{% endif %}{% if award.note %} <span class="award-note">{{ award.note | escape }}</span>{% endif %}</li>
    {% endfor %}
  </ul>
</section>
{% endif %}
