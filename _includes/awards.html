{% if site.data.awards %}
<h2>Selected Awards</h2>

<ul style="margin:0 0 5px;">
  {% for award in site.data.awards.main %}
  <li><a{% if award.link %} href="{{ award.link }}"{% endif %}><autocolor>{{ award.title }}</autocolor></a>{% if award.note %}<strong> <i style="color:#043361">{{ award.note }}</i></strong>{% endif %}</li>
  {% endfor %}
</ul>
{% endif %}
